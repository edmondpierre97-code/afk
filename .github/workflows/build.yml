name: Compiler l'appli Android TV

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire le projet
        run: unzip -q tv-samples-leanback-afrocinex.zip

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Rendre gradlew exécutable
        run: chmod +x Leanback/gradlew

      - name: Compiler l'APK
        working-directory: Leanback
        run: ./gradlew assembleDebug

      - name: Publier l'APK compilé
        uses: actions/upload-artifact@v4
        with:
          name: afrocinex-tv-debug
          path: Leanback/app/build/outputs/apk/debug/*.apk

      - name: Copier l'APK dans le repo pour recuperation
        run: |
          mkdir -p outputs
          cp Leanback/app/build/outputs/apk/debug/*.apk outputs/afrocinex-tv-debug.apk

      - name: Publier l'APK sur la branche build-output
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan build-output
          git reset --hard
          git add outputs/afrocinex-tv-debug.apk
          git commit -m "APK compile automatiquement"
          git push origin build-output --force
